{% extends "layout.html" %}
{% block body %}
  <div class="add-employee-container">
  <h2>Добавить нового сотрудника</h2>
    <!-- Flash‑сообщения -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'success' if category == 'success' else 'error' }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('add_employee') }}">
    <div class="form-group">
      <label for="full_name">ФИО:</label>
      <input type="text" id="full_name" name="full_name" required>
    </div>

    <div class="form-group">
      <label for="position">Должность:</label>
      <input type="text" id="position" name="position" required>
    </div>

    <div class="form-group">
      <label for="hire_date">Дата приёма на работу:</label>
      <input type="date" id="hire_date" name="hire_date" required>
    </div>

    <div class="form-group">
      <label for="salary">Зарплата:</label>
      <input type="number" id="salary" name="salary" min="0" step="0.1" required>
    </div>

    <div class="form-group">
      <label for="manager_id">Руководитель:</label>
      <select name="manager_id" id="manager_id" class="form-select" >
        <option value="">Нет руководителя</option>
         {% for manager in managers %}
            <option
              value="{{ manager.id }}"
              {% if employee.manager and employee.manager.id == manager.id %}selected{% endif %}>
              {{ manager.full_name }}
              {% if manager.position %} ({{ manager.position }}){% endif %}
            </option>
          {% endfor %}
        </select>
      </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Добавить сотрудника</button>
      <a href="{{ url_for('all_employees') }}" class="btn btn-secondary">Отмена</a>
    </div>
  </form>
  </div>
{% endblock %}
